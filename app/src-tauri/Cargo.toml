[package]
name = "wham_cam_app"
version = "0.3.0"
description = "WHAM_CAM desktop app (Tauri layer: windows, files, and the bridge to the engine)"
edition.workspace = true
license.workspace = true

[lib]
name = "wham_cam_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
tauri = { version = "2.12.5", features = [] }
tauri-plugin-dialog = "2"
wham_engine = { path = "../../engine" }
