[package]
name = "wham_engine"
version = "0.5.0"
description = "WHAM_CAM CAM engine: geometry, toolpaths and G-code. No UI, no file system."
edition.workspace = true
license.workspace = true

# Every dependency here must build for wasm32-unknown-unknown (see CLAUDE.md).
[dependencies]
serde = { version = "1", features = ["derive"] }
# Project files. float_roundtrip: numbers read back exactly as they were written.
serde_json = { version = "1", features = ["float_roundtrip"] }
# Offsetting. Pinned exactly (CLAUDE.md: libraries that shape toolpaths); only src/offset.rs uses it.
cavalier_contours = "=0.9.0"
# SVG import: XML, and SVG path data / transforms / lengths. Pinned exactly; only src/svg.rs uses
# them (MIT or Apache-2.0; build for WebAssembly; approved by the user 2026-11-20).
roxmltree = "=0.21.2"
svgtypes = "=0.16.2"

